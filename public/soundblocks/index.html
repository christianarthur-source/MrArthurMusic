<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>Sound Blocks · Mr. Arthur's Music Lab</title>
<meta name="description" content="Build a song from colourful sound blocks. Pick a world, drag in loops, add effects, record your own voice and share your song.">
<link rel="icon" type="image/png" sizes="32x32" href="/mr-arthur-favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/suite/tokens.css">
<link rel="stylesheet" href="/suite/suite-header.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="/suite/suite-header.js" data-name="Sound Blocks" data-icon="🧱" data-help="Pick a world. Tap a block to hear it, then drag it onto the stripes (or tap a place to drop it). Press Play. Use + to add more measures, Effects to change the sound, and the microphone block to record your own voice."></script>

<main class="app" id="app">

  <!-- 1. pick a world -->
  <section id="home" class="home" aria-labelledby="homeTitle">
    <h1 id="homeTitle" class="home-title"><span>Sound</span> <span>Blocks</span></h1>
    <p class="home-sub">Pick a world to start your song</p>
    <div class="worlds" id="worlds"></div>
  </section>

  <!-- 2. the studio -->
  <section id="studio" class="studio" hidden aria-label="Song">
    <div class="bar">
      <button type="button" class="tool" id="homeBtn" aria-label="Back to the worlds"><span class="ic" aria-hidden="true">🏠</span><span class="tx" aria-hidden="true">Worlds</span></button>
      <div class="world-chip" id="worldChip"><span class="wp" id="worldPic" aria-hidden="true"></span><span class="wt"><b id="worldName"></b><small id="worldInfo"></small></span></div>
      <button type="button" class="tool addtrack" id="addTrackBtn" aria-label="Add a track"><span class="ic" aria-hidden="true">➕</span><span class="tx" aria-hidden="true">Add a track</span></button>
      <button type="button" class="tool minus" id="subTrackBtn" aria-label="Take away the last track" hidden><span class="ic" aria-hidden="true">➖</span></button>
      <div class="remix" id="remix" hidden><span aria-hidden="true">🎁</span> Remix it!</div>
      <div class="spacer"></div>
      <button type="button" class="tool" id="startBtn" aria-label="Back to the start"><span class="ic" aria-hidden="true">⏮</span><span class="tx" aria-hidden="true">Start</span></button>
      <button type="button" class="tool" id="undoBtn" aria-label="Undo" disabled><span class="ic" aria-hidden="true">↶</span><span class="tx" aria-hidden="true">Undo</span></button>
      <button type="button" class="tool play" id="playBtn" aria-label="Play" aria-pressed="false"><span class="ic" aria-hidden="true" id="playIco">▶</span><span class="tx" aria-hidden="true" id="playTx">Play</span></button>
      <div class="fxwrap">
        <button type="button" class="tool" id="fxBtn" aria-label="Effects" aria-expanded="false" aria-controls="fxPanel"><span class="ic" aria-hidden="true">🎛️</span><span class="tx" aria-hidden="true">Effects</span><i class="dot" id="fxDot" hidden></i></button>
        <div class="fxpanel" id="fxPanel" hidden role="group" aria-label="Effects">
          <div class="fx-row"><label for="fxEcho"><span aria-hidden="true">🔁</span> Echo</label><input type="range" id="fxEcho" min="0" max="100" value="0" data-fx="echo"></div>
          <div class="fx-row"><label for="fxReverb"><span aria-hidden="true">🏛️</span> Reverb</label><input type="range" id="fxReverb" min="0" max="100" value="0" data-fx="reverb"></div>
          <div class="fx-row"><label for="fxMuffle"><span aria-hidden="true">🌊</span> Muffle</label><input type="range" id="fxMuffle" min="0" max="100" value="0" data-fx="muffle"></div>
          <div class="fx-row"><label for="fxCrunch"><span aria-hidden="true">🔥</span> Crunch</label><input type="range" id="fxCrunch" min="0" max="100" value="0" data-fx="crunch"></div>
          <button type="button" class="fx-reset" id="fxReset">Reset effects</button>
        </div>
      </div>
      <button type="button" class="tool share" id="shareBtn" aria-label="Share my song"><span class="ic" aria-hidden="true">🔗</span><span class="tx" aria-hidden="true">Share</span></button>
      <button type="button" class="tool" id="clearBtn" aria-label="Start over"><span class="ic" aria-hidden="true">🧹</span><span class="tx" aria-hidden="true">New</span></button>
    </div>

    <div class="board" id="board">
      <div class="scroller" id="scroller">
        <div class="track" id="track">
          <div class="ruler" id="ruler" aria-hidden="true"></div>
          <div class="lanes" id="lanes"></div>
          <div class="playhead" id="playhead" aria-hidden="true"></div>
        </div>
        <div class="addcol" id="addcol">
          <button type="button" class="add" id="addBtn" aria-label="Add a measure"><span class="ic" aria-hidden="true">➕</span></button>
          <button type="button" class="sub" id="subBtn" aria-label="Take away the last measure"><span aria-hidden="true">➖</span></button>
        </div>
      </div>

      <!-- recording: countdown, then a clip as long as one block -->
      <div class="rec" id="rec" hidden role="dialog" aria-modal="true" aria-label="Record your voice">
        <div class="rec-card">
          <div class="rec-big" id="recBig" aria-live="assertive">🎤</div>
          <div class="rec-sub sr" id="recSub"></div>
          <div class="rec-bar" id="recBar" hidden><i id="recProg"></i></div>
          <div class="rec-meter" id="recMeterBox" hidden aria-hidden="true"><i id="recMeter"></i></div>
          <label class="rec-hear" id="recHearBox" title="Hear the song while I record (use headphones)"><input type="checkbox" id="recHear" aria-label="Hear the song while I record. Use headphones."> <span aria-hidden="true">🎧</span></label>
          <p class="rec-note sr" id="recNote">Use headphones so the mic only hears you. Your recording stays on this computer.</p>
          <button type="button" class="big no" id="recCancel" aria-label="Cancel recording"><span aria-hidden="true">✖️</span></button>
        </div>
      </div>
    </div>

    <div class="tray" id="tray">
      <div class="tray-row loops" id="trayLoops" role="group" aria-label="Music blocks"></div>
      <div class="tray-row funs" id="trayFun" role="group" aria-label="Fun sounds"></div>
      <div class="trash" id="trash" aria-label="Trash. Drag a block here to take it away."><span aria-hidden="true">🗑️</span></div>
    </div>
  </section>
</main>

<!-- share -->
<dialog class="dlg" id="shareDlg" aria-label="Share my song">
  <div class="dlg-body">
    <div class="share-spin" id="shareSpin" aria-hidden="true">⏳</div>
    <div class="share-ready" id="shareReady" hidden>
      <div class="qr" id="qr" aria-hidden="true"></div>
      <input type="text" id="shareUrl" class="share-url" readonly aria-label="Link to my song" spellcheck="false">
      <p class="share-note" id="shareNote" hidden title="Your recordings stay on this computer, so friends will not hear them."><span aria-hidden="true">🎤🔒💻</span><span class="sr">Your recordings stay on this computer, so friends will not hear them.</span></p>
      <div class="dlg-actions">
        <button type="button" class="big copy" id="copyBtn" aria-label="Copy the link"><span aria-hidden="true" id="copyIco">📋</span></button>
        <button type="button" class="big close" id="shareClose" aria-label="Close"><span aria-hidden="true">✖️</span></button>
      </div>
    </div>
  </div>
</dialog>

<!-- start over? -->
<dialog class="dlg" id="clearDlg" aria-label="Start over? This takes away all the blocks.">
  <div class="dlg-body">
    <div class="ask" aria-hidden="true">🧹❓</div>
    <div class="dlg-actions">
      <button type="button" class="big yes" id="clearYes" aria-label="Yes, start over"><span aria-hidden="true">✔️</span></button>
      <button type="button" class="big no" id="clearNo" aria-label="No, keep my song"><span aria-hidden="true">✖️</span></button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
